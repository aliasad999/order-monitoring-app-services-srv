NO_AUTH_VALUE_HELP = Sie sind nicht berechtigt, Einträge in Wertehilfen einzusehen. Bitte wenden Sie sich an einen Administrator.
NO_AUTH_LIST = Sie sind nicht berechtigt, Einträge in der Liste anzuzeigen. Bitte wenden Sie sich an einen Administrator.
ERROR_AUTH_CALL = Beim Aufruf des Autorisierungsdienstes von Cobalt ist ein Fehler aufgetreten. Wenn Sie die Aktualisierung nicht durchführen, werden möglicherweise keine oder falsche Daten angezeigt. Bitte aktualisieren Sie die Anwendung.
