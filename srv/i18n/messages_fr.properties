NO_AUTH_VALUE_HELP = Vous n'êtes pas autorisé à consulter les entrées dans les aides à la valeur. Veuillez contacter un administrateur.
NO_AUTH_LIST = Vous n'êtes autorisé à voir aucune entrée dans la liste. Veuillez contacter un administrateur.
ERROR_AUTH_CALL = Une erreur s'est produite lors de l'appel du service d'autorisation de Cobalt. Il est possible que vous ne voyiez aucune donnée ou des données erronées si vous n'actualisez pas. Veuillez actualiser l'application.




