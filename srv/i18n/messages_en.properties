NO_AUTH_VALUE_HELP = You are not authorized to see any entries in value helps. Please contact an administrator.
NO_AUTH_LIST = You are not authorized to see any entries in the list. Please contact an administrator.
ERROR_AUTH_CALL = There was an error calling the authorization service from Cobalt, it is possible you will not see any data or wrong data if you do not refresh. Please refresh the application.
VARIANTS_MIGRATED = Variants have just been migrated to the cloud environment and won't be visible again until you refresh your browser. Please do so now instead of creating new ones. Thank you! 
ERROR_SORT_COL=please note: if a column is sorted, it must also be included as selected column
ERR_VALUE_HELP_NO_CACHE=Value help query not executed, as there is no session cache.