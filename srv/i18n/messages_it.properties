NO_AUTH_VALUE_HELP = Non sei autorizzato a vedere alcuna voce negli aiuti di valore. Contatta un amministratore.
NO_AUTH_LIST = Non sei autorizzato a vedere nessuna voce nell'elenco. Contatta un amministratore.
ERROR_AUTH_CALL = Si è verificato un errore durante la chiamata al servizio di autorizzazione da Cobalt, è possibile che non vedrai alcun dato o dati errati se non aggiorni. Aggiorna l'applicazione.
VARIANTS_MIGRATED = Variants have just been migrated to the cloud environment and won't be visible again until you refresh your browser. Please do so now instead of creating new ones. Thank you! 
ERROR_SORT_COL=Si prega di notare: se una colonna è ordinata, deve essere inclusa anche come colonna selezionata
ERR_VALUE_HELP_NO_CACHE=La query di aiuto valore non è stata eseguita, poiché non è presente alcuna cache di sessione.
NOTESNOTDELETED_USER_DIFFERENT=La nota può essere eliminata solo dall'utente che l'ha creata.



