NO_AUTH_VALUE_HELP = Değer yardımlarında herhangi bir girişi görme yetkiniz yok. Lütfen bir yöneticiyle iletişime geçin.
NO_AUTH_LIST = Listedeki hiçbir girişi görme yetkiniz yok. Lütfen bir yöneticiyle iletişime geçin.
ERROR_AUTH_CALL = Cobalt'tan yetkilendirme servisi aranırken bir hata oluştu, yenilemezseniz herhangi bir veri görmemeniz veya yanlış veri görmeniz mümkündür. Lütfen uygulamayı yenileyin.




